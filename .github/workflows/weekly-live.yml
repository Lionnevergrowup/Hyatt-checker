name: Weekly Hyatt report (live, self-hosted Windows)

# Drives a real Chromium against hyatt.com through Playwright. Has to
# run on a self-hosted runner whose outbound IP is residential
# (Kasada blocks GitHub-hosted runners). Setup: docs/SETUP-WINDOWS.md
#
# If no self-hosted runner is online, jobs queue and eventually expire.
# That's fine — the default `weekly.yml` keeps publishing the
# deeplink-only calendar from a GitHub-hosted runner.

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months ahead to fetch"
        required: false
        default: "6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        # Self-hosted Windows defaults to Restricted execution policy,
        # which blocks the temp .ps1 files Actions writes per-step. Use
        # an explicit invocation that bypasses policy for this process
        # only — no permanent system change required.
        shell: 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "{0}"'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python is on PATH
        run: |
          python --version
          pip --version

      - name: Install / update package with live extra
        run: |
          pip install --upgrade pip
          pip install -e ".[live]"

      - name: Ensure Chromium is installed for Playwright
        run: |
          python -m playwright install chromium

      - name: Restore pricing snapshot
        uses: actions/cache@v4
        with:
          path: .cache
          key: hyatt-pricing-win-${{ github.run_id }}
          restore-keys: |
            hyatt-pricing-win-

      - name: Drop stale per-window cache, keep snapshot.json
        run: |
          if (Test-Path .cache) {
            Get-ChildItem .cache -File -Filter *.json |
              Where-Object { $_.Name -ne 'snapshot.json' } |
              Remove-Item
          }

      - name: Generate report (live, fall back to deeplink-only)
        run: |
          New-Item -ItemType Directory -Force -Path public | Out-Null
          $fav = @()
          if (Test-Path data\favorites.txt) { $fav = @('--favorites','data\favorites.txt') }
          $months = "${{ github.event.inputs.months || '6' }}"
          $live = @('--source','live','--discover','--months',$months) + $fav + @('--debug-dir','public','--output','public\index.html','-v')
          & hyatt-checker @live
          if ($LASTEXITCODE -ne 0) {
            Write-Host "live failed, falling back to deeplink-only"
            $fallback = @('--source','none','--months',$months) + $fav + @('--output','public\index.html')
            & hyatt-checker @fallback
          }
          if (Test-Path .cache\snapshot.json) {
            Copy-Item .cache\snapshot.json public\snapshot.json
          }
          Get-ChildItem public

      - name: Commit refreshed hotels.json
        run: |
          git diff --quiet -- data\hotels.json
          if ($LASTEXITCODE -ne 0) {
            git config user.name "hyatt-checker-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data\hotels.json
            git commit -m "Auto-refresh hotels.json from Hyatt discovery"
            git push
          } else {
            Write-Host "hotels.json unchanged"
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
