name: Weekly Hyatt report (live, self-hosted)

# Same report as the default workflow but driven by a Playwright
# fetcher against hyatt.com — which is fronted by Kasada bot detection.
# Datacenter IPs (including GitHub-hosted runners) get blocked, so this
# workflow only runs on a self-hosted runner whose outbound IP is
# residential (e.g., a Raspberry Pi on your home network).
#
# Setup: see docs/SELF_HOSTED_RUNNER.md
#
# If no self-hosted runner is registered, jobs queue and eventually
# expire. That's fine — the default `weekly.yml` keeps publishing the
# deeplink-only calendar in the meantime.

on:
  schedule:
    - cron: "0 13 * * 0"  # Sunday 13:00 UTC
  workflow_dispatch:
    inputs:
      months:
        description: "Months ahead to fetch"
        required: false
        default: "6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with live extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restore pricing cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: hyatt-pricing-live-${{ github.run_id }}
          restore-keys: |
            hyatt-pricing-live-

      - name: Drop stale per-window cache, keep snapshot.json
        run: |
          if [ -d .cache ]; then
            find .cache -type f -name '*.json' ! -name 'snapshot.json' -delete
          fi

      - name: Generate report (live + discover)
        run: |
          mkdir -p public
          FAV=""
          if [ -f data/favorites.txt ]; then FAV="--favorites data/favorites.txt"; fi
          hyatt-checker --source live --discover \
            --months "${{ github.event.inputs.months || '6' }}" \
            $FAV --debug-dir public --output public/index.html -v || \
          hyatt-checker --source none \
            --months "${{ github.event.inputs.months || '6' }}" \
            $FAV --output public/index.html
          if [ -f .cache/snapshot.json ]; then cp .cache/snapshot.json public/snapshot.json; fi

      - name: Commit refreshed hotels.json
        run: |
          if git diff --quiet -- data/hotels.json; then
            echo "hotels.json unchanged"
          else
            git config user.name "hyatt-checker-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/hotels.json
            git commit -m "Auto-refresh hotels.json from Hyatt discovery"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest  # deploy step doesn't need the residential IP
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
