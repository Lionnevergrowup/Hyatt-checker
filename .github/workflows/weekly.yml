name: Weekly Hyatt report

on:
  schedule:
    # Sunday 13:00 UTC = ~8am US Central. Adjust to taste.
    - cron: "0 13 * * 0"
  workflow_dispatch:  # button on the Actions tab; tappable from the GitHub mobile app
    inputs:
      months:
        description: "Months ahead to fetch"
        required: false
        default: "6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate report (deeplink calendar)
        run: |
          mkdir -p public
          FAV=""
          if [ -f data/favorites.txt ]; then FAV="--favorites data/favorites.txt"; fi
          hyatt-checker --source none --months "${{ github.event.inputs.months || '6' }}" $FAV --output public/index.html -v
          ls -la public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
