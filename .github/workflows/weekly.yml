name: Weekly Hyatt report

on:
  schedule:
    # Sunday 13:00 UTC = ~8am US Central. Adjust to taste.
    - cron: "0 13 * * 0"
  workflow_dispatch:  # button on the Actions tab; tappable from the GitHub mobile app
    inputs:
      months:
        description: "Months ahead to fetch"
        required: false
        default: "6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with live extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restore pricing cache (carries snapshot.json for diffs)
        uses: actions/cache@v4
        with:
          path: .cache
          key: hyatt-pricing-${{ github.run_id }}
          restore-keys: |
            hyatt-pricing-

      - name: Drop stale per-window cache, keep snapshot.json
        run: |
          if [ -d .cache ]; then
            find .cache -type f -name '*.json' ! -name 'snapshot.json' -delete
          fi

      - name: Generate report (live + discover hotels, fall back to mock)
        run: |
          mkdir -p public
          FAV=""
          if [ -f data/favorites.txt ]; then FAV="--favorites data/favorites.txt"; fi
          if hyatt-checker --source live --discover --months "${{ github.event.inputs.months || '6' }}" $FAV --debug-dir public --output public/index.html -v; then
            echo "live ok"
          else
            echo "live failed, falling back to mock so the page still updates"
            hyatt-checker --source mock --months "${{ github.event.inputs.months || '6' }}" $FAV --output public/index.html
          fi
          if [ -f .cache/snapshot.json ]; then cp .cache/snapshot.json public/snapshot.json; fi
          ls -la public/ 2>/dev/null || true

      - name: Commit refreshed hotels.json
        run: |
          if git diff --quiet -- data/hotels.json; then
            echo "hotels.json unchanged"
          else
            git config user.name "hyatt-checker-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/hotels.json
            git commit -m "Auto-refresh hotels.json from Hyatt discovery"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
